<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
     <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="#">
    <title>Busqueda</title>
</head>

<body>
    <h1 class="centrar">Mis Pokemones</h1><br>    
     <input id="buscar" type="text" class="form-control" placeholder="...Escriba para filtrar el contenido" />
     <div id="autocomplete" class="barras">
         <table id="lista" class="table table-sm table-bordered table-hover table-responsive-sm">
             <caption>Lista de Pedidos</caption>
             <thead class="thead-dark">
                 <th>CustomerID</th>
                 <th>OrderID</th>
                 <th>EmployeeID</th>
                 <th>ShipCity</th>
             </thead>
            <tbody>  
                <template id='filas'>
                    <tr>
                        <td>${busqueda[i].name}</td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </template>               
            </tbody>       
    </div>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
